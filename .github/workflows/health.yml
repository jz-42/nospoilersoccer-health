name: Check public update health
on:
  # The monitored service dispatches this every ten minutes. The hourly schedule
  # is a backup for when the service itself is down; GitHub may delay or drop it.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write # alert markers are stored in, and cleared from, the Actions cache
concurrency:
  group: public-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test check.test.mjs
      - id: check
        run: node check.mjs
        env:
          MONITOR_URL: ${{ vars.MONITOR_URL }}
          EXPECTED_RESULTS: ${{ vars.EXPECTED_RESULTS }}
          EXPECTED_CHANNELS: ${{ vars.EXPECTED_CHANNELS }}
          REQUIRED_SETTINGS: ${{ vars.REQUIRED_SETTINGS }}
          EXPIRY_DOMAIN: ${{ vars.EXPIRY_DOMAIN }}
      # A failed run sends the email. A problem must still be there on the next
      # check (about ten minutes later) so brief provider blips that heal on
      # their own never email. After that, the same failure emails once a day
      # while it lasts; a different failure emails at once.
      - id: pending
        if: steps.check.outputs.failed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .alert
          key: pending-${{ github.run_id }}
          restore-keys: pending-
          lookup-only: true
      - if: steps.check.outputs.failed == 'true' && steps.pending.outputs.cache-matched-key == ''
        run: mkdir -p .alert && touch .alert/pending
      - if: steps.check.outputs.failed == 'true' && steps.pending.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: .alert
          key: pending-${{ github.run_id }}
      - if: steps.check.outputs.failed == 'true' && steps.pending.outputs.cache-matched-key == ''
        run: 'echo "::warning::First failed check, emailing if the next one fails too: $MESSAGE"'
        env:
          MESSAGE: ${{ steps.check.outputs.message }}
      - id: seen
        if: steps.check.outputs.failed == 'true' && steps.pending.outputs.cache-matched-key != ''
        uses: actions/cache/restore@v4
        with:
          path: .alert
          key: alert-${{ steps.check.outputs.signature }}-${{ steps.check.outputs.day }}
          lookup-only: true
      - if: steps.check.outputs.failed == 'true' && steps.pending.outputs.cache-matched-key != '' && steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p .alert && touch .alert/reported
      - if: steps.check.outputs.failed == 'true' && steps.pending.outputs.cache-matched-key != '' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .alert
          key: alert-${{ steps.check.outputs.signature }}-${{ steps.check.outputs.day }}
      - if: steps.check.outputs.failed == 'true' && steps.pending.outputs.cache-matched-key != '' && steps.seen.outputs.cache-hit == 'true'
        run: 'echo "::warning::Still failing, already reported today: $MESSAGE"'
        env:
          MESSAGE: ${{ steps.check.outputs.message }}
      - if: steps.check.outputs.failed == 'true' && steps.pending.outputs.cache-matched-key != '' && steps.seen.outputs.cache-hit != 'true'
        run: echo "::error::$MESSAGE" && exit 1
        env:
          MESSAGE: ${{ steps.check.outputs.message }}
      # Once healthy again, forget past failures so a recurrence is judged afresh.
      - if: steps.check.outputs.failed == 'false'
        run: |
          for prefix in pending- alert-; do
            gh cache list --key "$prefix" --json key --jq '.[].key' | xargs -r -n1 gh cache delete
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
